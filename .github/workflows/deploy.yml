# Publie le site : à chaque envoi sur la branche « site-react » (le code source), on vérifie les données,
# on construit le site et on remplace le contenu de la branche « main », que GitHub Pages affiche déjà
# (réglage « Deploy from a branch : main / root », rien à changer dans les paramètres).
# Si la vérification échoue, le site en ligne n'est pas touché.
name: Publier le site
on:
  push: { branches: [site-react] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: publish, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Remplacer le contenu de main par le site construit
        run: |
          cp -r legacy dist/legacy
          touch dist/.nojekyll
          printf 'Site construit automatiquement depuis la branche site-react (code source). Ne pas modifier ici.\n' > dist/README.md
          cd dist
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication du site depuis site-react ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
